[package]
name = "hwmon"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "persistence"] }
nvml-wrapper = "0.13.0"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_SystemInformation"] }
wmi = "0.18.4"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
