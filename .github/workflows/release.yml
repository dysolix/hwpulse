# Builds a tagged version and publishes the portable exe and the installer as a
# GitHub Release. Started by the Version workflow, by pushing a tag like v1.2.3
# (must match Cargo.toml), or by hand on a tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          current=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$current" ]]; then
            echo "::error::Run this on tag v$current (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    # Linux minutes count once, Windows minutes twice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "Hardware Monitor $VERSION" --generate-notes --verify-tag
