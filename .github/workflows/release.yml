# Builds a tagged version, signs it and publishes the portable exe and the installer
# as a GitHub Release. Started by the Version workflow, by pushing a tag like v1.2.3
# (must match Cargo.toml), or by hand on a tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          current=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$current" ]]; then
            echo "::error::Run this on tag v$current (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    # Linux minutes count once, Windows minutes twice.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds the signing key and only admits v* tags. Separate from the build job, so
    # the build scripts and proc macros of dependencies never run next to the key.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Install minisign
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign files
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          key="$RUNNER_TEMP/signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          for file in dist/*; do
            minisign -S -s "$key" -m "$file" -t "hwmon $VERSION"
            # Catches a key that doesn't match the public key in the repo.
            minisign -V -p installer/hwmon.pub -m "$file"
          done

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "Hardware Monitor $VERSION" --generate-notes --verify-tag
