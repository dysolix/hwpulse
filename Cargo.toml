[package]
name = "hwmon"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation"] }
wmi = "0.18.4"
